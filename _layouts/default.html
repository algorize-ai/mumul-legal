<!doctype html>
<html lang="{{ site.lang | default: 'ko-KR' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% if site.draft %}<meta name="robots" content="noindex, nofollow">{% endif %}
    <title>{% if page.title and page.title != site.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="16x16 32x32">
    <link rel="icon" href="{{ '/assets/images/favicon-32x32.png' | relative_url }}" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}" sizes="180x180">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">본문으로 바로가기</a>
    <header class="site-header">
      <nav aria-label="법률 문서">
        <a class="site-title" href="{{ '/' | relative_url }}">무물 수능 법률 문서</a>
        <div class="site-links">
          <a href="{{ '/terms/' | relative_url }}">이용약관</a>
          <a href="{{ '/privacy/' | relative_url }}">개인정보처리방침</a>
          <a href="{{ '/versions/' | relative_url }}">이전 버전</a>
        </div>
      </nav>
    </header>
    <main id="main-content" class="content">
      {{ content }}
    </main>
    <footer>
      <p>문의: <a href="mailto:justanswerservice@gmail.com">justanswerservice@gmail.com</a></p>
    </footer>
  </body>
</html>
